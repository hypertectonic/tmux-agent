name: Feature request
description: Suggest an ergonomic or detection improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Local or remote constraints
      description: Mention tmux, SSH, operating system, or provider constraints without sharing credentials or transcripts.
