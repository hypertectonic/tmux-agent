name: Bug report
description: Report incorrect behavior or a failed setup
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve this early release. Do not include terminal transcripts, pane captures, credentials, or private SSH configuration.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `tmux-agent doctor --json` after reviewing it. Do not paste terminal transcripts.
      render: json
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Agent provider
      options:
        - Codex
        - Claude
        - OpenCode
        - Grok
        - Not provider-specific
    validations:
      required: true
