[package]
name = "tmux-agent"
version = "0.8.1"
edition = "2024"
description = "A local-first agent activity view for tmux, with SSH federation"
authors = ["Tecto"]
license = "MIT"
repository = "https://github.com/hypertectonic/tmux-agent"
homepage = "https://github.com/hypertectonic/tmux-agent"
readme = "README.md"
keywords = ["tmux", "terminal", "agents", "developer-tools", "ssh"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.4"
tar = "0.4"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3.23"
