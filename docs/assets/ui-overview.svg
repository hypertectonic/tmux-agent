<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title description" xml:space="preserve">
  <title id="title">tmux-agent activity view</title>
  <desc id="description">The current dark terminal interface with status counts, provider badges, numeric session shortcuts, goal progress, location breadcrumbs, and a Codex subagent.</desc>
  <rect width="1100" height="580" rx="16" fill="#171a1f"/>
  <rect x="1" y="1" width="1098" height="578" rx="15" fill="none" stroke="#4b5563" stroke-width="2"/>
  <circle cx="28" cy="27" r="6" fill="#f87171"/>
  <circle cx="48" cy="27" r="6" fill="#fbbf24"/>
  <circle cx="68" cy="27" r="6" fill="#4ade80"/>
  <text x="550" y="33" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">tmux-agent</text>
  <line x1="20" y1="53" x2="1080" y2="53" stroke="#6b7280"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="25" y="70" width="140" height="32" rx="2" fill="#23373a"/>
    <text x="95" y="92" text-anchor="middle" fill="#96cdc8" font-size="18">tmux-agent</text>
    <text x="185" y="93" fill="#f87171" font-size="18">!1</text>
    <text x="230" y="93" fill="#4ade80" font-size="18">✓1</text>
    <text x="278" y="93" fill="#6ee6dc" font-size="18">●1</text>
    <line x1="20" y1="116" x2="1080" y2="116" stroke="#6b7280"/>

    <rect x="14" y="128" width="1072" height="68" fill="#232d37"/>
    <rect x="14" y="128" width="6" height="68" fill="#6ee6dc"/>
    <text x="31" y="158" fill="#6ee6dc" font-size="23" font-weight="700">⠇</text>
    <rect x="65" y="137" width="112" height="31" rx="2" fill="#143c3e"/>
    <text x="121" y="159" text-anchor="middle" fill="#6ee6dc" font-size="19" font-weight="700">CODEX</text>
    <rect x="187" y="137" width="22" height="31" rx="2" fill="#143c3e"/>
    <text x="198" y="159" text-anchor="middle" fill="#6ee6dc" font-size="19" font-weight="700">1</text>
    <text x="221" y="159" fill="#f3f4f6" font-size="21" font-weight="700">api-refactor</text>
    <text x="390" y="159" fill="#6ee6dc" font-size="19">working</text>
    <text x="502" y="159" fill="#e879f9" font-size="18">Pursuing goal (12m 18s)</text>
    <text x="221" y="187" fill="#6b7280" font-size="18">local › project › 1.1</text>

    <text x="221" y="220" fill="#facc15" font-size="21">↳</text>
    <text x="257" y="220" fill="#6b7280" font-size="18">subagent:</text>
    <text x="367" y="220" fill="#d1d5db" font-size="19" font-weight="700">review</text>
    <text x="458" y="220" fill="#4ade80" font-size="18">done</text>
    <text x="520" y="220" fill="#6b7280" font-size="18">· 1m 42s</text>

    <text x="31" y="258" fill="#f87171" font-size="22" font-weight="700">!</text>
    <rect x="65" y="237" width="112" height="31" rx="2" fill="#462b18"/>
    <text x="121" y="259" text-anchor="middle" fill="#f0a05a" font-size="19" font-weight="700">CLAUDE</text>
    <rect x="187" y="237" width="22" height="31" rx="2" fill="#2d2d2d"/>
    <text x="198" y="259" text-anchor="middle" fill="#91a5ab" font-size="19">2</text>
    <text x="221" y="259" fill="#f3f4f6" font-size="21" font-weight="700">documentation</text>
    <text x="414" y="259" fill="#f87171" font-size="19">needs input</text>
    <text x="221" y="287" fill="#6b7280" font-size="18">local › docs › 2.0</text>

    <text x="31" y="335" fill="#6b7280" font-size="22">○</text>
    <rect x="65" y="314" width="112" height="31" rx="2" fill="#32234b"/>
    <text x="121" y="336" text-anchor="middle" fill="#be91ff" font-size="17" font-weight="700">OPENCODE</text>
    <rect x="187" y="314" width="22" height="31" rx="2" fill="#2d2d2d"/>
    <text x="198" y="336" text-anchor="middle" fill="#91a5ab" font-size="19">3</text>
    <text x="221" y="336" fill="#f3f4f6" font-size="21" font-weight="700">frontend</text>
    <text x="340" y="336" fill="#6b7280" font-size="19">idle</text>
    <text x="221" y="364" fill="#6b7280" font-size="18">build-host › web › 3.2</text>

    <text x="31" y="412" fill="#4ade80" font-size="22">✓</text>
    <rect x="65" y="391" width="112" height="31" rx="2" fill="#143c3e"/>
    <text x="121" y="413" text-anchor="middle" fill="#6ee6dc" font-size="19" font-weight="700">CODEX</text>
    <rect x="187" y="391" width="22" height="31" rx="2" fill="#2d2d2d"/>
    <text x="198" y="413" text-anchor="middle" fill="#91a5ab" font-size="19">4</text>
    <text x="221" y="413" fill="#f3f4f6" font-size="21" font-weight="700">remote-tests | linux</text>
    <text x="520" y="413" fill="#4ade80" font-size="19">done</text>
    <text x="221" y="441" fill="#6b7280" font-size="18">build-host › integration › 1.0</text>

    <line x1="20" y1="470" x2="1080" y2="470" stroke="#374151"/>
    <text x="28" y="501" fill="#4ade80" font-size="17">●</text>
    <text x="50" y="501" fill="#6b7280" font-size="17">local v0.5.0</text>
    <text x="207" y="501" fill="#4ade80" font-size="17">●</text>
    <text x="229" y="501" fill="#6b7280" font-size="17">build-host v0.5.0</text>

    <line x1="20" y1="526" x2="1080" y2="526" stroke="#374151"/>
    <text x="28" y="558" fill="#6b7280" font-size="16">j/k move   / search   enter focus/view   r refresh   q close</text>
  </g>
</svg>
